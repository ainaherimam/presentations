<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Self-Play Component</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --font-primary: 'Calibri', 'Inter', 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono: 'Fira Code', 'SF Mono', 'Monaco', 'Consolas', monospace;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#f1f3f4;font-family:var(--font-primary);}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes popIn{0%{transform:scale(0.5);opacity:0}65%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes pulseRing{0%,100%{box-shadow:0 0 0 0 rgba(245,158,11,0.4)}50%{box-shadow:0 0 0 6px rgba(245,158,11,0)}}
@keyframes zFlash{0%{background:#fef9c3}100%{background:inherit}}
@keyframes bufferPop{0%{transform:scale(0) translateY(8px);opacity:0}70%{transform:scale(1.06) translateY(-2px)}100%{transform:scale(1) translateY(0);opacity:1}}
::-webkit-scrollbar{height:5px;width:5px}
::-webkit-scrollbar-track{background:#f1f5f9}
::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:3px}
button{cursor:pointer;}
button:disabled{cursor:not-allowed;}
input[type=range]{cursor:pointer;}
</style>
</head>
<body>
<div id="app" style="min-height:100vh;background:#f1f3f4;padding:16px 20px 32px;position:relative;"></div>

<script>
// ── Phase meta ──────────────────────────────────────────────────────────────
const PM = {
  GAME_START:      { color:'#6366f1', bg:'#eef2ff', icon:'⬡', label:'INIT BOARD' },
  MCTS_DONE:       { color:'#8b5cf6', bg:'#f5f3ff', icon:'⊛', label:'MCTS DONE' },
  POSITION_LOGGED: { color:'#10b981', bg:'#ecfdf5', icon:'⊕', label:'LOG POSITION' },
  MOVE_APPLIED:    { color:'#f59e0b', bg:'#fffbeb', icon:'◎', label:'MOVE APPLIED' },
  UPDATE_Z:        { color:'#f97316', bg:'#fff7ed', icon:'⟳', label:'UPDATE z' },
  FLUSH:           { color:'#ef4444', bg:'#fef2f2', icon:'⇢', label:'FLUSH → BUFFER' },
};

// ── Parser ──────────────────────────────────────────────────────────────────
function parseKV(fields) {
  const out = {};
  const mhMatch = fields.match(/move_history=(.+?)(?= \w+=|$)/);
  if (mhMatch) {
    out.move_history = mhMatch[1].trim();
    fields = fields.replace(/move_history=.+?(?= \w+=|$)/, '');
  }
  const re = /(\w+)=((?:[^\s=]+(?:,[\d.]+)*)|(?:[^=\s]+(?:;[^=\s]+)*))/g;
  let m;
  while ((m = re.exec(fields)) !== null) {
    const k = m[1], v = m[2];
    if (v.includes(','))      out[k] = v.split(',').map(Number);
    else if (v.includes(';')) out[k] = v.split(';').map(s => { const [t,z]=s.split(':'); return {t:parseInt(t),z:parseFloat(z)}; });
    else if (!isNaN(Number(v))) out[k] = Number(v);
    else                      out[k] = v;
  }
  return out;
}

function parseLine(line) {
  const parts = line.split(' | ');
  if (parts.length < 3) return null;
  return { phase: parts[0].trim(), event: parts[1].trim(), ...parseKV(parts.slice(2).join(' | ').trim()) };
}

function buildSteps(lines) {
  const steps = [];
  let poolEntries = [];
  let pendingMCTS = null;
  let pendingPos  = null;
  let zMap        = {};
  let sharedBuffer = [];

  const parsed = lines.map(parseLine).filter(Boolean);

  for (const r of parsed) {
    if (r.event === 'GAME_END' && Array.isArray(r.z))
      for (const {t,z} of r.z) zMap[t] = z;
  }

  const raw = [];

  for (const r of parsed) {
    switch (r.event) {
      case 'GAME_START':
        poolEntries  = [];
        sharedBuffer = [];
        raw.push({
          phase:'GAME_START', board:r.board, policy:null, mask:null, chosenAction:null,
          pool:[], sharedBuffer:[], move:null, player:null, temp:null,
          gameId:r.game_id,
          nextDesc:`Initialise board · game_id=${r.game_id} · mode=${r.mode}`,
        });
        break;

      case 'MCTS_DONE':
        pendingMCTS = r;
        raw.push({
          phase:'MCTS_DONE',
          board: raw.length ? raw[raw.length-1].board : '................',
          policy:r.policy, mask:null, chosenAction:r.action_idx,
          pool:poolEntries.map(e=>({...e})), sharedBuffer:[...sharedBuffer],
          move:r.move, player:r.player, temp:r.temp,
          nextDesc:`Run MCTS · move ${r.move} · player ${r.player} · τ=${r.temp} · chose cell ${r.action_idx}`,
        });
        break;

      case 'POSITION_LOGGED': {
        pendingPos = r;
        const mctsSnap = raw[raw.length - 1];
        if (mctsSnap && mctsSnap.phase === 'MCTS_DONE') mctsSnap.mask = r.mask;
        const entry = {
          board:r.board, planes:r.planes, policy:r.policy, mask:r.mask,
          action:pendingMCTS ? pendingMCTS.action_idx : null,
          player:r.player, move:r.move, z:0,
        };
        const newPool = [...poolEntries, entry];
        poolEntries = newPool;
        raw.push({
          phase:'POSITION_LOGGED', board:r.board, policy:r.policy, mask:r.mask,
          chosenAction:pendingMCTS ? pendingMCTS.action_idx : null,
          pool:newPool.map(e=>({...e})), sharedBuffer:[...sharedBuffer],
          move:r.move, player:r.player, temp:pendingMCTS?.temp,
          poolSize:r.pool_size,
          nextDesc:`Log position · t=${r.move} · (board, π, mask, z=0) added to pool · pool_size=${r.pool_size}`,
        });
        break;
      }

      case 'MOVE_APPLIED': {
        const prevPlayer = pendingMCTS?.player ?? (raw.length ? raw[raw.length-1].player : null);
        raw.push({
          phase:'MOVE_APPLIED', board:r.board,
          policy:pendingPos?.policy ?? null, mask:pendingPos?.mask ?? null,
          chosenAction:pendingMCTS ? pendingMCTS.action_idx : null,
          pool:poolEntries.map(e=>({...e})), sharedBuffer:[...sharedBuffer],
          move:r.move, player:prevPlayer, temp:null,
          moveStr:r.move_str, nextIdx:r.next_idx,
          nextDesc:`Apply move ${r.move_str} → board="${r.board}" · next player idx=${r.next_idx}`,
        });
        pendingMCTS = null;
        pendingPos  = null;
        break;
      }

      case 'GAME_END': {
        const updatedPool = poolEntries.map(e => ({
          ...e, z: zMap.hasOwnProperty(e.move) ? zMap[e.move] : 0, zUpdated:true,
        }));
        raw.push({
          phase:'UPDATE_Z', board:r.board, policy:null, mask:null, chosenAction:null,
          pool:updatedPool.map(e=>({...e})), sharedBuffer:[...sharedBuffer],
          move:null, player:null, temp:null,
          winner:r.winner, totalMoves:r.total_moves, moveHistory:r.move_history,
          nextDesc:`Game over · winner=${r.winner} · Assign z to all ${updatedPool.length} positions from outcome`,
        });
        const flushedBuffer = [...sharedBuffer, ...updatedPool];
        raw.push({
          phase:'FLUSH', board:r.board, policy:null, mask:null, chosenAction:null,
          pool:[], sharedBuffer:flushedBuffer,
          move:null, player:null, temp:null,
          winner:r.winner, totalMoves:r.total_moves, moveHistory:r.move_history,
          nextDesc:`Flush ${updatedPool.length} positions to shared memory buffer · clear pool`,
        });
        sharedBuffer = flushedBuffer;
        break;
      }

      default: break;
    }
  }

  for (let i = 0; i < raw.length; i++) {
    const cur  = raw[i];
    const prev = i > 0 ? raw[i - 1] : null;
    const isPolicyStep = cur.phase === 'MCTS_DONE' || cur.phase === 'POSITION_LOGGED';
    const isUpdateZ    = cur.phase === 'UPDATE_Z';
    const isFlush      = cur.phase === 'FLUSH';

    steps.push({
      phase:        cur.phase,
      board:        prev ? prev.board : cur.board,
      pool:         isUpdateZ ? cur.pool         : (prev ? prev.pool         : []),
      sharedBuffer: isFlush   ? cur.sharedBuffer : (prev ? prev.sharedBuffer : []),
      policy:       isPolicyStep ? cur.policy       : (prev ? prev.policy       : null),
      mask:         isPolicyStep ? cur.mask         : (prev ? prev.mask         : null),
      chosenAction: isPolicyStep ? cur.chosenAction : (prev ? prev.chosenAction : null),
      move:cur.move, player:cur.player, temp:cur.temp,
      gameId:cur.gameId, winner:cur.winner, totalMoves:cur.totalMoves,
      moveHistory:cur.moveHistory, moveStr:cur.moveStr, nextIdx:cur.nextIdx,
      poolSize:cur.poolSize,
      desc:`▶ Next: ${cur.nextDesc}`,
    });
  }

  return steps;
}

// ── Helpers ─────────────────────────────────────────────────────────────────
function parseBoardString(s) {
  if (!s || s.length !== 16) return Array(16).fill(0);
  return s.split('').map(c => c==='X' ? 1 : c==='O' ? -1 : 0);
}

function findNextMoveApplied(steps, fromIdx) {
  for (let i = fromIdx + 1; i < steps.length; i++) {
    if (steps[i].phase === 'MOVE_APPLIED' || steps[i].phase === 'UPDATE_Z' || steps[i].phase === 'FLUSH') return i;
  }
  return steps.length - 1;
}

function findPrevMoveApplied(steps, fromIdx) {
  for (let i = fromIdx - 1; i >= 0; i--) {
    if (steps[i].phase === 'MCTS_DONE' || steps[i].phase === 'GAME_START') return i;
  }
  return 0;
}

// ── SVG Board ───────────────────────────────────────────────────────────────
function makeBoardSVG(boardStr, policy, mask, chosenAction, player, size=220) {
  const cells = parseBoardString(boardStr);
  const N = 4, cell = size / N, pad = 3;
  const validPolicies = policy ? policy.filter((p,i) => mask && mask[i] > 0.5) : [];
  const maxPi = validPolicies.length ? Math.max(...validPolicies) : 1;
  const ringColor = player === 'O' ? '#dc2626' : '#1d4ed8';

  let inner = `
    <defs>
      <radialGradient id="gx" cx="50%" cy="35%" r="60%">
        <stop offset="0%" stop-color="#93c5fd"/><stop offset="100%" stop-color="#1d4ed8"/>
      </radialGradient>
      <radialGradient id="go" cx="50%" cy="35%" r="60%">
        <stop offset="0%" stop-color="#fca5a5"/><stop offset="100%" stop-color="#b91c1c"/>
      </radialGradient>
      <filter id="glow">
        <feGaussianBlur stdDeviation="2.5" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>`;

  cells.forEach((v, i) => {
    const cx = (i%N)*cell + cell/2, cy = Math.floor(i/N)*cell + cell/2;
    const x  = (i%N)*cell + pad,   y  = Math.floor(i/N)*cell + pad;
    const w  = cell - pad*2;
    const isChosen = chosenAction === i;
    const pi   = policy ? policy[i] : 0;
    const piN  = maxPi > 0 ? pi/maxPi : 0;
    const isValid = mask && mask[i] > 0.5;
    const isEmpty = v === 0;

    let fillColor;
    if (isEmpty) {
      if (isValid) {
        const alpha = (0.04+piN*0.14).toFixed(3);
        fillColor = `rgba(99,102,241,${alpha})`;
      } else {
        fillColor = '#f8fafc';
      }
    } else {
      fillColor = '#fff';
    }
    const strokeColor = (isValid && isEmpty && !isChosen) ? `rgba(99,102,241,${(0.2+piN*0.5).toFixed(2)})` : '#e2e8f0';

    inner += `<rect x="${x}" y="${y}" width="${w}" height="${w}" rx="5"
      fill="${fillColor}" stroke="${strokeColor}" stroke-width="1"/>`;

    if (isEmpty && isValid && pi > 0) {
      const barFill = isChosen ? ringColor : '#6366f1';
      inner += `<rect x="${x}" y="${y+w-4}" width="${w*piN}" height="4" rx="2" fill="${barFill}" opacity="0.75"/>`;
    }

    if (v !== 0) {
      const gid = v===1 ? 'url(#gx)' : 'url(#go)';
      const filt = isChosen ? 'url(#glow)' : '';
      inner += `<circle cx="${cx}" cy="${cy}" r="${cell*0.28}" fill="${gid}" ${filt?`filter="${filt}"`:''} style="animation:popIn 0.3s ease"/>`;
    }

    if (isChosen && isEmpty) {
      inner += `<circle cx="${cx}" cy="${cy}" r="${cell*0.27}" fill="none"
        stroke="${ringColor}" stroke-width="2.5" stroke-dasharray="3 2" opacity="0.9"/>`;
    }

    if (isEmpty && isValid && pi > 0.04) {
      const pct = (pi*100).toFixed(0);
      const txtColor = isChosen ? ringColor : '#6366f1';
      inner += `<text x="${cx}" y="${cy-3}" text-anchor="middle" font-size="10"
        font-family="var(--font-mono)" fill="${txtColor}" font-weight="500" opacity="0.9">${pct}%</text>`;
    }

    inner += `<text x="${x+3}" y="${y+9}" font-size="10" font-family="monospace" fill="#d1d5db" opacity="0.6">${i}</text>`;
  });

  return `<svg width="${size}" height="${size}" style="display:block;animation:fadeUp 0.3s ease">${inner}</svg>`;
}

// ── Policy Bars SVG ─────────────────────────────────────────────────────────
function makePolicyBarsSVG(policy, mask, chosen, player, width=340, height=64) {
  if (!policy) return `<div style="height:${height}px;display:flex;align-items:center;justify-content:center;color:#d1d5db;font-family:var(--font-mono);font-size:13px;">— no policy —</div>`;
  const valid = policy.map((p,i) => (mask && mask[i]>0.5) ? p : 0);
  const chosenColor = player === 'O' ? '#dc2626' : '#1d4ed8';
  const chosenLabel = player === 'O' ? '#b91c1c' : '#1d4ed8';
  const max = Math.max(...valid, 0.001);
  const bw = (width - (policy.length-1)*2) / policy.length;
  let inner = '';
  policy.forEach((_,i) => {
    const bh = (valid[i]/max)*(height-18);
    const isC = i===chosen;
    const fill = isC ? chosenColor : valid[i]>0 ? '#6366f1' : '#e2e8f0';
    const opac = isC ? 1 : valid[i]>0 ? 0.55 : 0.25;
    inner += `<rect x="${i*(bw+2)}" y="${height-bh-16}" width="${bw}" height="${Math.max(bh,0)}" rx="2"
      fill="${fill}" opacity="${opac}"/>`;
    if (isC && valid[i]>0.03) {
      inner += `<text x="${i*(bw+2)+bw/2}" y="${height-bh-19}" text-anchor="middle"
        font-size="9" font-family="var(--font-mono)" fill="${chosenLabel}" font-weight="500">${(valid[i]*100).toFixed(1)}%</text>`;
    }
    const lblColor = isC ? chosenLabel : '#94a3b8';
    inner += `<text x="${i*(bw+2)+bw/2}" y="${height-3}" text-anchor="middle"
      font-size="10" font-family="var(--font-mono)" fill="${lblColor}">${i}</text>`;
  });
  return `<svg width="${width}" height="${height}">${inner}</svg>`;
}

// ── Pool mini-card ──────────────────────────────────────────────────────────
function makePoolEntry(entry, isNewest, zUpdated) {
  const cells = parseBoardString(entry.board);
  const cs = 8;
  const z   = entry.z;
  const zIsZero = z === 0;
  const zIsPos  = typeof z==='number' && z > 0;
  const zIsNeg  = typeof z==='number' && z < 0;
  const zColor  = zIsPos ? '#059669' : zIsNeg ? '#dc2626' : '#94a3b8';
  const zBg     = zIsPos ? '#ecfdf5' : zIsNeg ? '#fef2f2' : '#f8fafc';
  const zBorder = zIsPos ? '#a7f3d0' : zIsNeg ? '#fecaca' : '#e2e8f0';
  const zLabel  = zIsZero ? 'z=0' : `z=${zIsPos?'+':''}${z.toFixed(1)}`;
  const showZ   = zUpdated && !zIsZero;

  let rects = '';
  cells.forEach((v, i) => {
    let fill;
    if (v===1) fill='#3b82f6';
    else if (v===-1) fill='#ef4444';
    else if (entry.mask && entry.mask[i]>0.5) fill='#eff6ff';
    else fill='#f8fafc';
    rects += `<rect x="${(i%4)*cs+1}" y="${Math.floor(i/4)*cs+1}" width="${cs-1}" height="${cs-1}" rx="1" fill="${fill}"/>`;
  });

  let actionRect = '';
  if (entry.action !== null && entry.action !== undefined) {
    const sc = entry.player==='O' ? '#dc2626' : '#1d4ed8';
    actionRect = `<rect x="${(entry.action%4)*cs+1}" y="${Math.floor(entry.action/4)*cs+1}"
      width="${cs-1}" height="${cs-1}" rx="1" fill="none" stroke="${sc}" stroke-width="2"/>`;
  }

  const svgBorder = isNewest ? '2px solid #6366f1' : `1.5px solid ${zBorder}`;
  const zBorderStyle = showZ ? `1px solid ${zBorder}` : '1px solid #e2e8f0';
  const zFontColor = showZ ? zColor : '#94a3b8';
  const zBgStyle = showZ ? zBg : '#f8fafc';
  const zAnim = showZ ? 'zFlash 0.8s ease' : 'none';

  return `<div style="display:flex;flex-direction:column;align-items:center;gap:3px;animation:${isNewest?'popIn 0.45s ease forwards':'none'}">
    <div style="font-size:13px;font-family:var(--font-mono);color:#94a3b8;background:#f1f5f9;border-radius:3px;padding:1px 5px;">t=${entry.move}</div>
    <svg width="${cs*4+2}" height="${cs*4+2}" style="border-radius:4px;box-shadow:0 0 0 ${svgBorder}">
      ${rects}${actionRect}
    </svg>
    <div style="font-size:14px;font-family:var(--font-mono);font-weight:500;color:${zFontColor};background:${zBgStyle};border:${zBorderStyle};border-radius:4px;padding:1px 6px;transition:all 0.5s ease;animation:${zAnim};">${zLabel}</div>
  </div>`;
}

// ── Buffer entry ────────────────────────────────────────────────────────────
function makeBufferEntry(entry, isNew) {
  const cells = parseBoardString(entry.board);
  const cs = 7;
  const z   = entry.z;
  const zIsPos = typeof z==='number' && z>0;
  const zIsNeg = typeof z==='number' && z<0;
  const zColor = zIsPos ? '#059669' : zIsNeg ? '#dc2626' : '#94a3b8';
  const zBg    = zIsPos ? '#ecfdf5' : zIsNeg ? '#fef2f2' : '#f8fafc';
  const bord   = zIsPos ? '#a7f3d0' : zIsNeg ? '#fecaca' : '#e2e8f0';

  let rects = '';
  cells.forEach((v, i) => {
    const fill = v===1 ? '#3b82f6' : v===-1 ? '#ef4444' : '#f8fafc';
    rects += `<rect x="${(i%4)*cs+1}" y="${Math.floor(i/4)*cs+1}" width="${cs-1}" height="${cs-1}" rx="1" fill="${fill}"/>`;
  });

  const valStr = typeof z==='number' ? z.toFixed(1) : '0';
  const sign = zIsPos ? '+' : '';

  return `<div style="display:flex;flex-direction:column;align-items:center;gap:2px;flex-shrink:0;animation:${isNew?'bufferPop 0.5s ease forwards':'none'};">
    <div style="font-size:14px;font-family:var(--font-mono);color:#94a3b8;">t=${entry.move}</div>
    <svg width="${cs*4+2}" height="${cs*4+2}" style="border-radius:3px;box-shadow:0 0 0 1.5px ${bord}">
      ${rects}
    </svg>
    <div style="font-size:13px;font-family:var(--font-mono);font-weight:500;color:${zColor};background:${zBg};border-radius:3px;padding:1px 5px;">${sign}${valStr}</div>
  </div>`;
}

// ── App State ───────────────────────────────────────────────────────────────
const state = {
  steps:     [],
  stepIdx:   0,
  playing:   false,
  speed:     1000,
  error:     '',
  loaded:    false,
  prevPhase: null,
  prevBufLen:0,
  timer:     null,
};

// ── Rendering ───────────────────────────────────────────────────────────────
function render() {
  const app = document.getElementById('app');
  const { steps, stepIdx, playing, speed, error, loaded } = state;
  const step  = steps[stepIdx] || null;
  const meta  = step ? (PM[step.phase] || PM.GAME_START) : PM.GAME_START;
  const total = steps.length;

  const isFlushing = step?.phase === 'FLUSH';
  const isUpdateZ  = step?.phase === 'UPDATE_Z';
  const boardStr   = step?.board     || '................';
  const policy     = step?.policy    || null;
  const mask       = step?.mask      || null;
  const chosenAction = step?.chosenAction ?? null;
  const pool       = step?.pool      || [];
  const sharedBuf  = step?.sharedBuffer || [];
  const prevBuf    = state.prevBufLen || 0;

  const nextMoveIdx = loaded ? findNextMoveApplied(steps, stepIdx) : 0;
  const prevMoveIdx = loaded ? findPrevMoveApplied(steps, stepIdx) : 0;
  const phaseChanged = step && step.phase !== state.prevPhase;

  // ── Header ──
  let headerRight = ``;
  if (loaded) {
    headerRight += `
      <div style="display:flex;align-items:center;gap:8px;background:white;border-radius:12px;padding:7px 14px;border:1px solid #e2e8f0;">
        <span style="font-size:13px;color:#94a3b8;letter-spacing:1px;font-family:var(--font-mono);">SPEED</span>
        <input type="range" id="speedRange" min="200" max="3000" step="100" value="${speed}"
          style="width:60px;accent-color:${meta.color};cursor:pointer;"/>
        <span style="font-size:13px;color:#64748b;min-width:32px;font-family:var(--font-mono);">${(speed/1000).toFixed(1)}s</span>
      </div>`;
  }

  let html = `
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;">
      <div>
        <div style="font-family:var(--font-primary);font-weight:700;font-size:28px;color:#2c3e50;letter-spacing:-0.3px;line-height:1;">Self-Play Component</div>
      </div>
      <div style="display:flex;gap:10px;align-items:center;">${headerRight}</div>
    </div>`;

  if (error) {
    html += `<div style="background:#fef2f2;border:1.5px solid #fecaca;border-radius:10px;padding:9px 14px;margin-bottom:14px;font-size:13px;color:#dc2626;">${error}</div>`;
  }

  if (!loaded) { app.innerHTML = html; bindEvents(); return; }

  if (!step) { app.innerHTML = html; bindEvents(); return; }

  // ── Timeline ──
  let timelineDots = '';
  steps.forEach((s, i) => {
    const m = PM[s.phase]||PM.GAME_START;
    const active=i===stepIdx, done=i<stepIdx;
    const bg = active?m.color:done?m.color:'#e2e8f0';
    const w  = active?15:8, h=active?15:8;
    const shadow = active ? `0 0 0 3px ${m.color}40` : 'none';
    const opacity = active?1:done?0.6:0.25;
    timelineDots += `<div data-gotoidx="${i}" class="tldot" title="${m.label} (step ${i+1})"
      style="flex:1;display:flex;justify-content:center;cursor:pointer;">
      <div style="width:${w}px;height:${h}px;border-radius:50%;background:${bg};border:${active?'2.5px solid white':'none'};box-shadow:${shadow};opacity:${opacity};transition:all 0.25s ease;flex-shrink:0;"></div>
    </div>`;
  });

  const tlProgress = (stepIdx/Math.max(total-1,1))*100;

  // ── Board + Policy grid ──

        ${meta.icon} ${meta.label}
      </div>
    </div>`;

  app.innerHTML = html;
  bindEvents();

  // auto-scroll buffer
  const bufScroll = document.getElementById('bufferScroll');
  if (bufScroll) bufScroll.scrollLeft = bufScroll.scrollWidth;
}

function bindEvents() {
  // Speed
  const speedRange = document.getElementById('speedRange');
  if (speedRange) speedRange.addEventListener('input', (e) => {
    state.speed = +e.target.value;
    render();
  });

  // Navigation buttons
  const { steps, stepIdx } = state;
  const total = steps.length;

  const b = (id, fn) => { const el=document.getElementById(id); if(el) el.addEventListener('click',fn); };
  b('btnFirst',    () => { stopPlay(); goTo(0); });
  b('btnPrevMove', () => { stopPlay(); goTo(findPrevMoveApplied(steps, stepIdx)); });
  b('btnPrev',     () => { stopPlay(); goTo(stepIdx-1); });
  b('btnPlay',     () => { state.playing = !state.playing; schedulePlay(); render(); });
  b('btnNext',     () => { stopPlay(); goTo(stepIdx+1); });
  b('btnNextMove', () => { stopPlay(); goTo(findNextMoveApplied(steps, stepIdx)); });
  b('btnLast',     () => { stopPlay(); goTo(total-1); });

  // Timeline / phase dots
  document.querySelectorAll('.tldot').forEach(el => {
    el.addEventListener('click', () => {
      const idx = parseInt(el.dataset.gotoidx);
      if (!isNaN(idx)) { stopPlay(); goTo(idx); }
    });
  });
}

function loadLog(text) {
  state.error = '';
  try {
    const lines = text.split('\n').filter(l => l.trim().startsWith('GAME'));
    if (!lines.length) { state.error = 'No GAME lines found.'; render(); return; }
    const s = buildSteps(lines);
    if (!s.length) { state.error = 'Could not parse steps.'; render(); return; }
    state.steps = s;
    state.stepIdx = 0;
    state.prevPhase = null;
    state.prevBufLen = 0;
    state.playing = false;
    state.loaded = true;
    render();
  } catch(e) { state.error = 'Parse error: ' + e.message; render(); }
}

function goTo(idx) {
  const clamped = Math.max(0, Math.min(state.steps.length-1, idx));
  state.prevPhase  = state.steps[state.stepIdx]?.phase || null;
  state.prevBufLen = state.steps[state.stepIdx]?.sharedBuffer?.length || 0;
  state.stepIdx = clamped;
  render();
}

function stopPlay() {
  state.playing = false;
  clearTimeout(state.timer);
}

function schedulePlay() {
  clearTimeout(state.timer);
  if (!state.playing || !state.loaded) return;
  state.timer = setTimeout(() => {
    if (state.stepIdx < state.steps.length - 1) {
      goTo(state.stepIdx + 1);
      schedulePlay();
    } else {
      state.playing = false;
      render();
    }
  }, state.speed);
}
